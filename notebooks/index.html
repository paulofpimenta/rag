<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GraphRAG - Query Provenance Only</title>
    <script src="https://unpkg.com/3d-force-graph"></script>
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        #3d-graph { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        #ui-overlay {
            position: absolute; top: 20px; left: 20px; z-index: 100;
            color: white; background: rgba(0, 0, 0, 0.85);
            padding: 20px; border-radius: 12px; border: 1px solid #444; width: 300px;
        }
        #status { font-size: 0.85em; color: #00ffcc; margin-top: 10px; line-height: 1.4; }
        .legend-item { display: flex; align-items: center; margin: 8px 0; font-size: 0.9em;}
        .dot { width: 12px; height: 12px; border-radius: 50%; margin-right: 10px; }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <h2 style="margin:0 0 10px 0;">Query Trace View</h2>
        <p style="font-size: 0.9em; color: #bbb;">Showing only Queries and their direct evidence (provenance).</p>
        
        <div class="legend">
            <div class="legend-item"><div class="dot" style="background: #E6194B;"></div> Paper (Source)</div>
            <div class="legend-item"><div class="dot" style="background: #3CB44B;"></div> Section (Evidence)</div>
            <div class="legend-item"><div class="dot" style="background: #f5d142;"></div> Query (Target)</div>
        </div>
        <div id="status">Filtering for query-related nodes...</div>
    </div>

    <div id="3d-graph"></div>

    <script>
        const statusElement = document.getElementById('status');

        fetch('graph_data.json')
            .then(res => res.json())
            .then(data => {
                // 1. Identify all Query nodes (Group 4)
                const queryNodes = data.nodes.filter(n => n.group === 4);
                const queryIds = new Set(queryNodes.map(n => n.id));

                // 2. Find all links connected to a Query
                const queryLinks = data.links.filter(l => 
                    queryIds.has(l.source) || queryIds.has(l.target)
                );

                // 3. Identify "Neighbor" nodes (the evidence/papers the query points to)
                const neighborIds = new Set();
                queryLinks.forEach(l => {
                    neighborIds.add(l.source);
                    neighborIds.add(l.target);
                });

                // 4. Create the filtered dataset
                const filteredNodes = data.nodes.filter(n => neighborIds.has(n.id));
                const filteredData = {
                    nodes: filteredNodes,
                    links: queryLinks
                };

                statusElement.innerHTML = `
                    <b>Active View:</b><br>
                    Queries Found: ${queryIds.size}<br>
                    Evidence Nodes: ${filteredNodes.length - queryIds.size}<br>
                    Total Connections: ${queryLinks.length}
                `;

                const Graph = ForceGraph3D()(document.getElementById('3d-graph'))
                    .graphData(filteredData)
                    .nodeId('id')
                    .nodeLabel(node => node.text || node.title || node.id)
                    .nodeAutoColorBy('group')
                    .linkLabel('rel')
                    .linkDirectionalParticles(2) // Flowing dots to show direction
                    .linkDirectionalParticleSpeed(0.005)
                    .linkDirectionalArrowLength(4)
                    .linkDirectionalArrowRelPos(1);

                // Styling adjustments
                Graph.nodeColor(node => {
                    if (node.group === 4) return '#f5d142'; // Bright Yellow for Queries
                    if (node.group === 1) return '#E6194B'; // Red for Papers
                    if (node.group === 2) return '#3CB44B'; // Green for Sections
                    return '#ffffff';
                });

                // Zoom in on the query clusters
                Graph.d3Force('charge').strength(-200);
                Graph.d3Force('link').distance(80);

            })
            .catch(err => {
                statusElement.style.color = "#ff4444";
                statusElement.innerText = "Error loading data.";
                console.error(err);
            });
    </script>
</body>
</html>
